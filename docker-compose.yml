services:
  db:
    image: mysql:8.0
    container_name: shop-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ecomdb
    volumes:
      - shop-db-data:/var/lib/mysql
    networks:
      - shop-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./Ecommerce-Backend
    container_name: shop-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ecomdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shop-net

  frontend:
    build: ./Ecommerce-Frontend
    container_name: shop-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - shop-net

networks:
  shop-net:

volumes:
  shop-db-data:
